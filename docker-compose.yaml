version: "3.9"

services:

  minio:
    image: minio/minio:latest
    container_name: doc-clf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console UI
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  minio-data:
